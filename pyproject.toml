[project]
name = "parlor"
version = "2.1.0"
description = "Real-time multimodal AI — have natural voice + vision conversations over a cloud LLM (OpenAI / OpenRouter), no local model downloads"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135.3",
    "huggingface-hub>=1.0.0",  # smart-turn-v3 model download
    "numpy>=2.4.4",
    "onnxruntime>=1.24.4",
    "pillow>=11.0",  # benchmark camera frames (tests/fixtures)
    "python-dotenv>=1.0.0",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.43.0",
    "websockets>=16.0",
]

[project.scripts]
parlor = "parlor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["benchmarks"]  # tests synthesize speech via benchmarks/fixtures.py

